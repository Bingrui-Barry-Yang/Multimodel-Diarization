[project]
name = "blob-tool"
version = "0.1.0"
description = "Privacy filter for classroom video: tracked colour blobs + altered voice"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "ultralytics>=8.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "lap>=0.5",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
sam = [
    "transformers>=5.0",
    "accelerate>=1.0",
    "timm>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

# macOS gets the PyPI wheel (with MPS); Linux (the Docker image) gets the CPU-only wheel,
# avoiding ~15 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blob_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
